[package]
categories = ["finance", "api-bindings"]
description = "Rust reimplementation of yfinance for US equity market data from Yahoo Finance."
edition = "2024"
keywords = ["finance", "yfinance", "stocks", "yahoo", "market-data"]
license = "Apache-2.0"
name = "adaq-data-stock-us"
readme = "README.md"
repository = "https://github.com/tonywxx/adaq-data-stock-us"
version = "0.1.1"

# Keep the published crate lean: ship only the library/binary source,
# examples, license and readme. Exclude the vendored Python reference, CI
# files, internal agent memory, ADRs and project meta so they never reach
# crates.io.
exclude = [
  "vendor/",
  ".github/",
  ".workbuddy/",
  "docs/",
  ".cargo/",
  ".gitmodules",
  "AGENTS.md",
  "CONTEXT.md",
  "PARITY_PIN",
  "README.zh-CN.md",
]

[workspace]
members = ["xtask"]

[dependencies]
base64 = "0.23.1"
chrono = {version = "0.4.45", features = ["serde"]}
futures = "0.3"
primp = "1"
prost = "0.14.4"
rusqlite = {version = "0.40.2", features = ["bundled"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
thiserror = "2"
tokio = {version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"]}
tokio-tungstenite = {version = "0.30.0", features = ["rustls-tls-webpki-roots"]}
# Provide a rustls crypto provider (tokio-tungstenite pulls rustls with
# default-features = false, so none is selected automatically). Exactly one
# provider feature must be enabled for rustls 0.23 to pick a default.
polars = {version = "0.55.2", optional = true}
rustls = {version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"]}

[features]
default = []
polars = ["dep:polars"]

[dev-dependencies]
tokio = {version = "1.53.1", features = ["full"]}
