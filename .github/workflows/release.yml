name: Release to crates.io

# Publish the crate to crates.io whenever a semantic-version tag is pushed.
# Pattern matches v0.1.0, v0.2.3, v1.0.0, etc. (covers the requested v0.x.x).
on:
  push:
    tags:
      - 'v*.*.*'

# Least-privilege: the publish step only needs the registry token injected as
# an environment secret; it does not need write access to repo contents.
permissions:
  contents: read

# Don't let two tag pushes publish at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Cargo reads this automatically when talking to crates.io.
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Gate 0: don't publish a crate that fails its own tests.
      - name: Run tests
        run: cargo test --workspace

      # Gate 1: make sure the crate packs and builds cleanly. No network
      # publish happens here, and a failure stops the job before the real
      # publish — i.e. "dry-run test first".
      - name: Verify package (dry-run)
        run: cargo publish --dry-run --package adaq-data-stock-us

      # Gate 2: only reached if the dry-run above succeeded.
      - name: Publish to crates.io
        run: cargo publish --package adaq-data-stock-us
